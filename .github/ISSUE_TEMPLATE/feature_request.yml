name: 功能建议
description: 想要新的快捷提问、交互方式或集成
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先看一眼 README 的 Roadmap 段落，避免重复。范围越小越容易实现。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 讲课时需要在多块屏幕上切换，现在每次都要先把浮窗拖过去……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的做法
      placeholder: 截图时记住上次的选区，或者支持按显示器编号直接框选……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及部分
      options:
        - 浮窗界面 / 交互
        - 截图与选区
        - 提问与回答（含 DSH 插件）
        - 配置与安装
        - 文档
    validations:
      required: true
